<div class="admin-login-page">
  <div class="login-card">
    <div class="login-brand">SIRAY <span>LUXURY</span></div>

    <div class="login-line"></div>

    <p class="login-subtitle">ESPACE SÉCURISÉ</p>
    <h2>Administration</h2>
    <p class="login-description">Connectez-vous pour accéder à votre espace de gestion.</p>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label>Nom d'utilisateur</label>
        <input
          type="text"
          [ngModel]="username()"
          (ngModelChange)="username.set($event)"
          name="username"
          placeholder="Votre nom d'utilisateur"
          required
        />
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input
          type="password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          placeholder="Votre mot de passe"
          required
        />
      </div>

      @if (errorMessage()) {
        <div class="login-message">
          {{ errorMessage() }}
        </div>
      }

      <button type="submit">SE CONNECTER <span>→</span></button>
    </form>

    <div class="login-footer">SIRAY LUXURY © 2026</div>
  </div>
</div>
